<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <link rel="icon" href="https://assets.hackclub.com/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      background-color: #0f0f0f;
      color: #f5f2ee;
      font-family: 'DM Sans', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    nav {
      border-bottom: 2px solid #222;
      padding: 16px 48px;
    }

    nav a {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      text-decoration: none;
      margin-right: 28px;
    }

    nav a:hover {
      color: #ec3750;
    }

    nav .logo {
      font-size: 1rem;
      color: #f5f2ee;
      margin-right: 48px;
    }

    nav .logo span {
      color: #ec3750;
    }

    .container {
      padding: 100px 48px;
      max-width: 700px;
    }

    .error-code {
      font-family: 'DM Serif Display', serif;
      font-size: 8rem;
      color: #ec3750;
      line-height: 1;
      margin: 0 0 8px 0;
    }

    .error-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #555;
      margin-bottom: 32px;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.6rem;
      font-weight: 400;
      line-height: 1.15;
      margin: 0 0 20px 0;
    }

    p {
      color: #888;
      line-height: 1.8;
      font-size: 1rem;
      max-width: 480px;
      margin-bottom: 40px;
    }

    .back-link {
      display: inline-block;
      background-color: #ec3750;
      color: white;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-decoration: none;
      padding: 16px 36px;
      border: 2px solid #ec3750;
    }

    .back-link:hover {
      background-color: transparent;
      color: #ec3750;
    }

    footer {
      border-top: 1px solid #222;
      padding: 24px 48px;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #444;
      position: fixed;
      bottom: 0;
      width: 100%;
      box-sizing: border-box;
      background-color: #0f0f0f;
    }
  </style>
</head>
<body>

  <nav>
    <a class="logo" href="index.html">Hack<span>Club</span></a>
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <a href="https://hackclub.com" target="_blank">Hack Club</a>
  </nav>

  <div class="container">
    <div class="error-code">404</div>
    <p class="error-label">Page not found</p>
    <h1>This page does not exist.</h1>
    <p>
      Whatever you were looking for is not here. Maybe the link broke,
      maybe it never existed. Either way, head back home and start again.
    </p>
    <a class="back-link" href="index.html">Go back home</a>
  </div>

  <footer>
    Hack Club - hackclub.com
  </footer>

</body>
</html>
